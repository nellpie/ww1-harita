<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWI Harita</title>

<style>
body { margin:0; background:#0e0b06; overflow:hidden; font-family:Arial; }

#map-wrap { position:fixed; inset:0; cursor:grab; }
#map-img { position:absolute; top:0; left:0; transform-origin:0 0; }

/* MINI POPUP */
#mini-popup {
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translate(-50%,20px);
  background:#111;
  border-radius:12px;
  padding:10px;
  width:220px;
  color:white;
  opacity:0;
  transition:all .25s ease;
}
#mini-popup.show {
  opacity:1;
  transform:translate(-50%,0);
}

/* DETAIL POPUP */
#detail-popup {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity .25s ease;
}
#detail-popup.show { opacity:1; }

.card {
  background:#111;
  padding:20px;
  border-radius:12px;
  max-width:320px;
  text-align:center;
  transform:scale(.9);
  transition:transform .25s ease;
}
#detail-popup.show .card { transform:scale(1); }

button {
  margin-top:10px;
  padding:6px;
  border:none;
  border-radius:6px;
  background:#333;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="map-wrap">
  <img id="map-img" src="1914_country.jpg">
</div>

<script>
let scale=1, ox=0, oy=0;
let img=document.getElementById('map-img');
let wrap=document.getElementById('map-wrap');

let hitboxes=[];
let countryData={};

fetch('hitboxes.json').then(r=>r.json()).then(d=>hitboxes=d.countries);
fetch('countries_data.js').then(r=>r.json()).then(d=>countryData=d);

function toImg(x,y){ return {x:(x-ox)/scale, y:(y-oy)/scale}; }

function inside(p, vs){
 let i,j,inside=false;
 for(i=0,j=vs.length-1;i<vs.length;j=i++){
  let xi=vs[i][0], yi=vs[i][1];
  let xj=vs[j][0], yj=vs[j][1];
  let intersect=((yi>p.y)!=(yj>p.y)) && (p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi);
  if(intersect) inside=!inside;
 }
 return inside;
}

wrap.onclick = e => {
 let p = toImg(e.clientX, e.clientY);
 for (let c of hitboxes){
  if(c.points && inside(p,c.points)){
    showMiniPopup(c.name);
    return;
  }
 }
};

function showMini(name){
 let old=document.getElementById('mini-popup');
 if(old) old.remove();

 let info=countryData[name]||{};

 let el=document.createElement('div');
 el.id='mini-popup';
 el.innerHTML=`
   <img src="${info.flag||''}" style="width:100%;height:100px;object-fit:cover;border-radius:8px">
   <b>${name}</b>
   <div style="font-size:12px;opacity:.8">${info.short||''}</div>
   <button>Detay</button>
 `;
 document.body.appendChild(el);

 setTimeout(()=>el.classList.add('show'),10);

 el.querySelector('button').onclick = ()=> showDetail(name);
}

function showDetail(name){
 let old=document.getElementById('detail-popup');
 if(old) old.remove();

 let info=countryData[name]||{};

 let el=document.createElement('div');
 el.id='detail-popup';
 el.innerHTML=`
  <div class="card">
    <h2>${name}</h2>
    <p>${info.description||'Bilgi yok'}</p>
    <button>Kapat</button>
  </div>
 `;
 document.body.appendChild(el);

 setTimeout(()=>el.classList.add('show'),10);

 el.querySelector('button').onclick = ()=>{
   el.classList.remove('show');
   setTimeout(()=>el.remove(),200);
 };
}

// PAN
let down=false, start;
wrap.onmousedown=e=>{ down=true; start={x:e.clientX,y:e.clientY,ox,oy}; };
window.onmousemove=e=>{
 if(!down) return;
 ox=start.ox + e.clientX-start.x;
 oy=start.oy + e.clientY-start.y;
 img.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;
};
window.onmouseup=()=>down=false;

// ZOOM
wrap.onwheel=e=>{
 e.preventDefault();
 let f=e.deltaY<0?1.1:.9;
 scale*=f;
 img.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;
};
// ── COUNTRY DATA ─────────────────────────
let countryData = {};

fetch('countries_data.json') // ⚠️ json yap
  .then(r => r.json())
  .then(d => countryData = d)
  .catch(() => console.warn("country data yok"));

// ── MINI POPUP ─────────────────────────
function showMiniPopup(name) {
  let el = document.getElementById('mini-popup');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mini-popup';
    el.style.position = 'fixed';
    el.style.bottom = '90px';
    el.style.left = '50%';
    el.style.transform = 'translate(-50%,20px)';
    el.style.opacity = '0';
    el.style.transition = 'all .25s ease';
    el.style.background = '#111';
    el.style.borderRadius = '12px';
    el.style.padding = '10px';
    el.style.width = '220px';
    el.style.color = 'white';
    el.style.zIndex = '60';
    document.body.appendChild(el);
  }

  const info = countryData[name] || {};

  el.innerHTML = `
    <img src="${info.flag || ''}" 
         style="width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:6px;">
    <div style="font-weight:bold">${name}</div>
    <div style="font-size:12px;opacity:.8">${info.short || ''}</div>
    <button id="more-btn" style="margin-top:6px;width:100%">Detay</button>
  `;

  setTimeout(() => {
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%,0)';
  }, 10);

  document.getElementById('more-btn').onclick = () => showDetailPopup(name);
}

// ── DETAIL POPUP ─────────────────────────
function showDetailPopup(name) {
  let el = document.getElementById('detail-popup');

  if (!el) {
    el = document.createElement('div');
    el.id = 'detail-popup';
    el.style.position = 'fixed';
    el.style.inset = '0';
    el.style.background = 'rgba(0,0,0,0.85)';
    el.style.display = 'flex';
    el.style.alignItems = 'center';
    el.style.justifyContent = 'center';
    el.style.opacity = '0';
    el.style.transition = 'opacity .25s';
    el.style.zIndex = '70';
    document.body.appendChild(el);
  }

  const info = countryData[name] || {};

  el.innerHTML = `
    <div style="background:#111;padding:20px;border-radius:12px;max-width:320px;text-align:center;transform:scale(.9);transition:.25s">
      <h2>${name}</h2>
      <p>${info.description || 'Bilgi yok'}</p>
      <button id="close-btn">Kapat</button>
    </div>
  `;

  setTimeout(() => {
    el.style.opacity = '1';
    el.firstChild.style.transform = 'scale(1)';
  }, 10);

  document.getElementById('close-btn').onclick = () => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 200);
  };

</script>
</body>
</html>
